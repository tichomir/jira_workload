version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# jira_workload — local Podman Compose stack
#
# Quick start:
#   macOS / Linux:  ./start.sh
#   Windows (WSL2): ./start.sh  (from a WSL2 terminal)
#   Windows (PS):   .\start.ps1
#
# Manual start:
#   cp config/deployment.env.example .env   # then fill in credentials
#   podman-compose up --build
#
# Requirements:
#   - Podman >= 4.x  (rootless mode supported and recommended)
#   - podman-compose >= 1.x  (pip install podman-compose)
#   - macOS: podman machine must be initialised and running
#       podman machine init && podman machine start
#   - Linux: rootless Podman works natively; no daemon required
#   - Windows: run from WSL2 with Podman installed inside the WSL2 distro
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
    image: jira-workload:latest
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT:     ${PORT:-4000}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - backup_data:/app/data/backups
      - sdi_tmp:/app/data/sdi-tmp
      - export_data:/app/data/exports
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-4000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ─── Optional: Caddy HTTPS sidecar (Option B — offline HTTPS) ──────────────
  # Uncomment this service to enable a local HTTPS reverse proxy on port 4443.
  # Requires:
  #   1. mkcert installed and mkcert -install run on your machine.
  #   2. Certificates generated: mkcert localhost 127.0.0.1 ::1
  #   3. Cert files placed in ./certs/ (gitignored — do not commit).
  #   4. A Caddyfile in the project root (copy from Caddyfile.example).
  #   5. ATLASSIAN_REDIRECT_URI=https://localhost:4443/oauth/callback in .env
  #
  # See OAUTH_SETUP.md § 2a Option B for the full step-by-step guide.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   ports:
  #     - "4443:4443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - ./certs:/certs:ro
  #   depends_on:
  #     - app
  #   restart: unless-stopped

# ─── Named volumes (persisted across container restarts) ──────────────────────
volumes:
  backup_data:
    driver: local
  sdi_tmp:
    driver: local
  export_data:
    driver: local
