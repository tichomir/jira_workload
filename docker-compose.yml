version: "3.9"

services:
  oauth-service:
    build: .
    env_file:
      - .env
    environment:
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET}
      ATLASSIAN_REDIRECT_URI: ${ATLASSIAN_REDIRECT_URI}
      ATLASSIAN_AUTH_URL: ${ATLASSIAN_AUTH_URL}
      ATLASSIAN_TOKEN_URL: ${ATLASSIAN_TOKEN_URL}
      ATLASSIAN_RESOURCES_URL: ${ATLASSIAN_RESOURCES_URL}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      SOFT_DELETE_RETENTION_DAYS: ${SOFT_DELETE_RETENTION_DAYS}
      REFRESH_TOKEN_EXPIRY_WARN_DAYS: ${REFRESH_TOKEN_EXPIRY_WARN_DAYS}
      REFRESH_TOKEN_INACTIVITY_THRESHOLD_DAYS: ${REFRESH_TOKEN_INACTIVITY_THRESHOLD_DAYS}
    ports:
      - "3000:3000"
