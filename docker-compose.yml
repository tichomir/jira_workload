version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# jira_workload — local Docker Compose stack
#
# Quick start:
#   macOS / Linux:  ./start.sh
#   Windows:        .\start.ps1  (or start.bat)
#
# Manual start:
#   cp config/deployment.env.example .env   # then fill in credentials
#   docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
    image: jira-workload:latest
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT:     ${PORT:-4000}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - backup_data:/app/data/backups
      - sdi_tmp:/app/data/sdi-tmp
      - export_data:/app/data/exports
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-4000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

# ─── Named volumes (persisted across container restarts) ──────────────────────
volumes:
  backup_data:
    driver: local
  sdi_tmp:
    driver: local
  export_data:
    driver: local
