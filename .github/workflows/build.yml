name: Build and Publish Container Image

# Build a versioned container image on every push to main and on tagged releases.
# Images are published to the GitHub Container Registry (ghcr.io) with two tags:
#   :latest          — always tracks the HEAD of main
#   :<short-sha>     — immutable tag for every merge (e.g. :a1b2c3d)
#   :<semver>        — set when a GitHub Release is created (e.g. :v1.2.0)

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up multi-arch builder ──────────────────────────────────────
      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Authenticate to ghcr.io ────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Derive image tags ──────────────────────────────────────────────
      # Produces tags such as:
      #   ghcr.io/<owner>/<repo>:latest          (on push to main)
      #   ghcr.io/<owner>/<repo>:a1b2c3d         (short SHA, always)
      #   ghcr.io/<owner>/<repo>:v1.2.3          (on GitHub Release)
      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Short git SHA — immutable, useful for pinning deployments
            type=sha,prefix=,format=short
            # :latest on pushes to the default branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            # Semver tags derived from GitHub Release tag (e.g. v1.2.3 → :1.2.3, :1.2, :1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # ── 5. Build and push ─────────────────────────────────────────────────
      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Build for Intel/AMD and Apple Silicon / ARM servers in one shot.
          platforms: linux/amd64,linux/arm64
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer caching via GitHub Actions cache — speeds up subsequent builds.
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── 6. Summary ────────────────────────────────────────────────────────
      - name: Print image digest
        run: echo "Image digest ${{ steps.meta.outputs.version }}"
